<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Brevity app UI</title>
  <desc id="desc">A clean local AI summarizer interface with model ready indicator, text input, and summarize button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f5"/>
      <stop offset="100%" stop-color="#f2f2f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>

  <g transform="translate(0,-20)">
    <text x="600" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#111827">Brevity.</text>
    <text x="600" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6b7280">100% offline, on-device summarization powered by QVAC.</text>

    <g filter="url(#shadow)">
      <rect x="300" y="220" width="600" height="360" rx="26" fill="#f5f5f4" stroke="#e5e7eb"/>

      <rect x="420" y="252" width="180" height="42" rx="21" fill="#dcfce7"/>
      <circle cx="445" cy="273" r="7" fill="#16a34a"/>
      <path d="M441 273 L444 277 L451 269" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="470" y="280" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#166534" font-weight="600">Model Ready</text>

      <rect x="360" y="330" width="480" height="150" rx="18" fill="#f1f5f9" stroke="#d1d5db" stroke-width="2"/>
      <text x="395" y="395" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9ca3af">Paste your document or notes here...</text>

      <rect x="760" y="520" width="180" height="54" rx="14" fill="#0f172a"/>
      <text x="850" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" font-weight="600">Summarize</text>
    </g>
  </g>
</svg>
