<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brevity | Local AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <main class="w-full max-w-2xl">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-medium tracking-tight text-gray-900">Brevity.</h1>
            <p class="text-sm text-gray-500 mt-2">100% offline, on-device summarization powered by QVAC.</p>
        </header>

        <div class="glass-card rounded-2xl p-6 sm:p-8 border border-gray-100">
            <textarea id="inputText" rows="6" 
                class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all outline-none resize-none text-gray-700"
                placeholder="Paste your document or notes here..."></textarea>
            
            <div class="mt-4 flex justify-end">
                <button id="summarizeBtn" 
                    class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 disabled:opacity-50">
                    <span id="btnText">Summarize</span>
                    <svg id="loadingIcon" class="animate-spin h-4 w-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>

            <div id="outputContainer" class="mt-6 hidden">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Summary</h3>
                <p id="outputText" class="text-gray-800 leading-relaxed text-sm bg-green-50/50 p-4 rounded-xl border border-green-100"></p>
            </div>
        </div>
    </main>

    <script>
        const btn = document.getElementById('summarizeBtn');
        const btnText = document.getElementById('btnText');
        const loadingIcon = document.getElementById('loadingIcon');
        const outputContainer = document.getElementById('outputContainer');
        const outputText = document.getElementById('outputText');
        const inputText = document.getElementById('inputText');

        btn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) return;

            // UI Loading state
            btn.disabled = true;
            btnText.innerText = 'Running Locally...';
            loadingIcon.classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    outputText.innerText = data.summary;
                    outputContainer.classList.remove('hidden');
                } else {
                    alert(data.error || 'An error occurred during local inference.');
                }
            } catch (err) {
                alert('Network error communicating with local server.');
            } finally {
                // Restore UI
                btn.disabled = false;
                btnText.innerText = 'Summarize';
                loadingIcon.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
