<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brevity | Local AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <main class="w-full max-w-2xl">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-medium tracking-tight text-gray-900">Brevity.</h1>
            <p class="text-sm text-gray-500 mt-2">100% offline, on-device summarization powered by QVAC.</p>
        </header>

        <div class="glass-card rounded-2xl p-6 sm:p-8 border border-gray-100">
            <div id="modelStatus" class="mb-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-yellow-50 text-yellow-700 text-xs font-medium border border-yellow-200 transition-colors">
                <svg class="animate-spin h-3 w-3 text-yellow-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Downloading & Loading Local Model...
            </div>

            <textarea id="inputText" rows="6"
                class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all outline-none resize-none text-gray-700 disabled:opacity-50"
                placeholder="Paste your document or notes here..." disabled></textarea>

            <div class="mt-4 flex justify-end">
                <button id="summarizeBtn" disabled
                    class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btnText">Waiting for Model...</span>
                    <svg id="loadingIcon" class="animate-spin h-4 w-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>

            <div id="outputContainer" class="mt-6 hidden">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Summary</h3>
                <!-- Changed to <pre> to properly format JSON if it falls back to it -->
                <pre id="outputText" class="text-gray-800 leading-relaxed text-sm bg-green-50/50 p-4 rounded-xl border border-green-100 whitespace-pre-wrap font-sans"></pre>
            </div>
        </div>
    </main>

    <script>
        const btn = document.getElementById('summarizeBtn');
        const btnText = document.getElementById('btnText');
        const loadingIcon = document.getElementById('loadingIcon');
        const outputContainer = document.getElementById('outputContainer');
        const outputText = document.getElementById('outputText');
        const inputText = document.getElementById('inputText');
        const modelStatus = document.getElementById('modelStatus');

        const checkModelStatus = async () => {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                if (data.ready) {
                    modelStatus.className = "mb-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-50 text-green-700 text-xs font-medium border border-green-200";
                    modelStatus.innerHTML = `<svg class="h-3 w-3 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> Model Ready`;
                    inputText.disabled = false;
                    btn.disabled = false;
                    btnText.innerText = 'Summarize';
                    clearInterval(statusInterval);
                }
            } catch (err) {
                console.warn('Waiting for backend...');
            }
        };

        const statusInterval = setInterval(checkModelStatus, 2000);
        checkModelStatus();

        btn.addEventListener('click', async () => {
            const text = inputText.value.trim();
            if (!text) return;

            btn.disabled = true;
            btnText.innerText = 'Summarizing...';
            loadingIcon.classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();

                if (response.ok) {
                    // Final failsafe to absolutely prevent [object Object] rendering
                    const finalOutput = typeof data.summary === 'string' ? data.summary : JSON.stringify(data.summary, null, 2);
                    outputText.innerText = finalOutput;
                    outputContainer.classList.remove('hidden');
                } else {
                    alert(data.error || 'An error occurred.');
                }
            } catch (err) {
                alert('Network error communicating with local server.');
            } finally {
                btn.disabled = false;
                btnText.innerText = 'Summarize';
                loadingIcon.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
